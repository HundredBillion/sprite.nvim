name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: ["v0.11.0", "stable", "nightly"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - uses: actions/checkout@v4
        with:
          repository: HundredBillion/VSVim
          ref: 18948648ae0238d95d58fbe74fea011b9be47e40
          path: .test/vsvim
      - name: Tests
        env:
          VSVIM_SOURCE: ${{ github.workspace }}/.test/vsvim
        run: nvim -l tests/run.lua
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check bin lua tests scripts
